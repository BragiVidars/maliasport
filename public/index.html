  <title>Viðhald í gangi</title>
  <style>
    body {
      background: #222;
      color: #fff;

      padding: 2rem 3rem;

    }
    h1 { color: #ffb300; }
  </style>

<body>
  <div class="box">
    <h1>Viðhald í gangi</h1>
    <p>Síðan er lokuð tímabundið vegna viðhalds.<br>Vinsamlegast reyndu aftur eftir 30 mínútur.</p>
    <p>Takk fyrir þolinmæðina!</p>
  </div>
</body>
</html>
